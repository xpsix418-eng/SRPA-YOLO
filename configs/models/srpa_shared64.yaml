# SRPA-YOLO Stage-I model with a 64-channel shared detection representation.
nc: 1
scale: n
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, CBAM, []]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, BasicStage, [1024, 1, 4, 2]]
  - [-1, 1, EMA, [32]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 1, GhostConv, [512, 3, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C2f, [128]]
  - [-1, 1, DWConv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 1, GhostConv, [256, 3, 1]]
  - [-1, 1, DWConv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 1, GhostConv, [512, 3, 1]]
  - [[21, 24, 27], 1, RepSharedDetect, [nc, 64]]
