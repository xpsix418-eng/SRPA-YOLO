name: srpa-yolo
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.0
  - torchvision>=0.15
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - matplotlib
  - opencv
  - pillow
  - pyyaml
  - pip
  - pip:
      - polars>=0.20.0
      - timm>=0.9.0
      - psutil>=5.9.0
      - ultralytics-thop>=2.0.18
      - pytest>=7.4.0
      - -e .
